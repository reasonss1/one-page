<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会议通知 · 一页纸框图示例</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #192b31;
      --muted: #455b63;
      --line: #ccd9dd;
      --accent: #245e5b;
      --warm: #75430e;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #eaf0f0; line-height: 1.55; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 36px 36px; background: #f9fbfb; }
    h1, h2, h3, p { margin: 0; }
    .meta { display: flex; gap: 10px 24px; flex-wrap: wrap; justify-content: space-between;
            padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .meta p { color: var(--muted); font-size: 15px; }
    .meta p:first-child { color: var(--accent); font-weight: 700; letter-spacing: .13em; }
    .headline { border: 1px solid #d6bb91; border-left: 6px solid #9c601b;
                background: #fdf5e8; border-radius: 12px; padding: 18px 22px; }
    .kicker { color: var(--warm); font-size: 15px; font-weight: 700; }
    h1 { font-size: clamp(24px, 4.3vw, 38px); line-height: 1.27; margin: 4px 0 6px; }
    .headline p:last-child { color: var(--warm); font-size: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
    .box, .flow { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: white; padding: 16px 20px; }
    h2 { font-size: 15px; font-weight: 700; color: var(--accent); }
    .box h3 { font-size: 22px; margin: 4px 0; }
    .box p { font-size: 16px; color: var(--muted); }
    .steps { display: grid; grid-template-columns: 1fr 8.5rem 1fr; align-items: center; gap: 10px;
             list-style: none; padding: 0; margin: 11px 0 0; }
    .step { padding: 11px 14px; border: 1px solid #a9c7c6; border-radius: 8px; background: #eef6f5; }
    .step .type { color: var(--accent); font-size: 14px; }
    .step strong { font-size: 18px; display: block; }
    .connector { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.3; }
    .arrow { font-size: 27px; line-height: 1; display: block; color: var(--accent); }
    .arrow-down { display: none; }
    @media screen and (max-width: 590px) {
      main { padding: 18px 16px 24px; }
      .headline, .box, .flow { padding: 14px; }
      .headline p:last-child { font-size: 16px; }
      .grid, .steps { grid-template-columns: 1fr; }
      .arrow-right { display: none; }
      .arrow-down { display: block; }
    }
    @page { size: A4; margin: 12mm; }
    @media print {
      body, main { background: white; }
      main { padding: 0; }
      .headline, .box, .flow { break-inside: avoid; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main>
    <header class="meta">
      <p>会议通知 · 发布判断</p>
      <p>给会议组织负责人</p>
    </header>
    <section class="headline" aria-labelledby="answer">
      <p class="kicker">当前结论</p>
      <h1 id="answer">通知暂不能发</h1>
      <p>场地尚未确认，通知还未发出。</p>
    </section>
    <div class="grid">
      <section class="box" aria-labelledby="done">
        <h2 id="done">已完成</h2>
        <h3>纪要已整理</h3>
        <p>三项决定已与参会人核对。</p>
      </section>
      <section class="box" aria-labelledby="block">
        <h2 id="block">阻塞项</h2>
        <h3>场地待确认</h3>
        <p>确认场地是发送通知的前置条件。</p>
      </section>
    </div>
    <section class="flow" aria-labelledby="next">
      <h2 id="next">什么时候能发？</h2>
      <div class="steps">
        <div class="step"><span class="type">前置条件 · 尚未满足</span><strong>确认场地</strong></div>
        <div class="connector">
          <span>仅在确认后</span>
          <span class="arrow arrow-right" aria-hidden="true">⟶</span>
          <span class="arrow arrow-down" aria-hidden="true">↓</span>
        </div>
        <div class="step"><span class="type">后续动作 · 尚未执行</span><strong>发送会议通知</strong></div>
      </div>
    </section>
  </main>
</body>
</html>
